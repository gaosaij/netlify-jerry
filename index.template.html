<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章列表</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #e5e5e5;
    --accent: #007bff;
    --card-bg: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8e8e8;
      --muted: #9a9a9a;
      --border: #2a2d33;
      --accent: #4c9aff;
      --card-bg: #1b1e24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 28px;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li + li {
    margin-top: 12px;
  }
  a.article {
    display: block;
    padding: 16px 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.article:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .title {
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
  }
  .empty {
    color: var(--muted);
  }
  .desc {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <h1>文章列表</h1>
    <ul>
<!--ARTICLES-->
    </ul>
  </main>
<script>
// 读取通过管理页上传/搬运的文章，插入到置顶项之后（读取失败就只显示上面的静态列表）
(function () {
  // 路径宽松比较：忽略大小写、.html 后缀、百分号编码、结尾斜杠（Netlify 会把 .html 地址跳转成小写且无后缀的地址）
  var norm = function (p) { try { p = decodeURIComponent(p); } catch (e) {} return p.replace(/\.html?$/i, '').replace(/\/+$/, '').toLowerCase(); };
  var STATUS = { importing: '正在抓取解析', ocr: 'OCR 识别中', idle: '尚未翻译', queued: '排队翻译中', translating: '翻译中', error: '翻译中断，可到管理页继续' };
  fetch('/api/articles', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (list) {
      var ul = document.querySelector('ul');
      var empty = ul.querySelector('.empty');
      if (empty && list.length) empty.remove();
      var pinned = ul.querySelectorAll('li[data-pinned]');
      var anchor = pinned.length ? pinned[pinned.length - 1].nextSibling : ul.firstChild;
      list.forEach(function (m) {
        // 站内静态文章已经有对照版时，隐藏英文原版，只显示对照版
        if (m.origPath) {
          ul.querySelectorAll('a.article').forEach(function (x) {
            if (norm(x.getAttribute('href')) === norm(m.origPath)) x.parentNode.remove();
          });
        }
        var desc = m.kind === 'raw' ? '搬运的网页'
          : m.status === 'done' ? '中英对照'
          : m.status === 'skip' ? '原文已有中文'
          : (STATUS[m.status] || '') + (m.total ? '：' + Math.min(m.done, m.total) + ' / ' + m.total + ' 段' : '');
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'article'; a.href = '/t/' + m.slug;
        var t = document.createElement('div'); t.className = 'title'; t.textContent = m.title;
        var d = document.createElement('div'); d.className = 'desc'; d.textContent = desc;
        a.append(t, d); li.append(a);
        ul.insertBefore(li, anchor);
      });
    })
    .catch(function () {});
})();
</script>
</body>
</html>
